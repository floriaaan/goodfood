version: "3"

tasks:
  dev:
    desc: Lance le service en local (hors Docker) — coupler avec `task services:up`
    cmds:
      - go run .

  build:
    desc: Build le binaire Go
    cmds:
      - go build -o bin/log .

  test:
    desc: Lance les tests
    cmds:
      - go test ./...

  docker:up:
    desc: Lance le service (+ sa base + RabbitMQ) via Docker
    cmds:
      - docker compose -f ../docker-compose.yml up -d --build log-service log-postgres event-broker

  docker:down:
    desc: Arrête le service (+ sa base)
    cmds:
      - docker compose -f ../docker-compose.yml stop log-service log-postgres

  docker:logs:
    desc: Logs du service
    cmds:
      - docker compose -f ../docker-compose.yml logs -f --tail=200 log-service

  # Version standalone (sa propre RabbitMQ, sans le reste de la stack): voir la racine,
  # task log:up / log:down / log:logs (docker-compose.log.yml).
